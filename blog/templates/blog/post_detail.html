{% extends "base.html" %}
{% load markdown_extras %}

{% block extra_head %}
<!-- Schema.org for Blog Post -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ post.title|escapejs }}",
  "image": [
        "{{ post.display_cover_image_url }}"
   ],
  "datePublished": "{{ post.created_at|date:'c' }}",
  "dateModified": "{{ post.updated_at|date:'c' }}",
  "author": [{
      "@type": "Person",
      "name": "{{ post.author|escapejs }}"
    }]
}
</script>
{% endblock %}

{% block content %}
<article class="bg-stone-50 py-12 sm:py-16">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <header class="mb-10 text-center max-w-3xl mx-auto">
            <div class="inline-flex items-center rounded-full bg-amber-100 px-4 py-1 text-xs font-semibold uppercase tracking-[0.24em] text-amber-800 mb-5">
                Sauna Guide Blog
            </div>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-900 mb-4">{{ post.title }}</h1>
            <div class="flex items-center justify-center text-slate-500 text-sm">
                <span>{{ post.created_at|date:"F j, Y" }}</span>
                <span class="mx-2">•</span>
                <span>By {{ post.author }}</span>
            </div>
        </header>

        <figure class="mb-12 overflow-hidden rounded-[2rem] border border-stone-200 bg-white shadow-xl shadow-stone-200/70">
            <img class="w-full object-cover max-h-[540px]" src="{{ post.display_cover_image_url }}" alt="{{ post.title }}" loading="lazy">
        </figure>

        <div class="mx-auto max-w-3xl rounded-[2rem] bg-white px-6 py-8 shadow-sm ring-1 ring-stone-200 sm:px-10 sm:py-10">
            <div class="prose prose-lg prose-slate max-w-none prose-headings:font-bold prose-headings:tracking-tight prose-a:text-primary prose-a:no-underline hover:prose-a:text-primary-dark prose-strong:text-slate-900 prose-img:rounded-2xl prose-blockquote:border-l-4 prose-blockquote:border-amber-400 prose-blockquote:bg-amber-50 prose-blockquote:px-6 prose-blockquote:py-4 prose-code:rounded prose-code:bg-slate-100 prose-code:px-1.5 prose-code:py-0.5 prose-code:text-slate-900 prose-pre:rounded-2xl prose-pre:bg-slate-900">
                {{ post.content|markdownify }}
            </div>
        </div>

        <div class="mt-12 pt-8 border-t border-slate-200">
            <a href="{% url 'post_list' %}" class="inline-flex items-center text-primary hover:text-primary-dark font-medium">
                <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to all articles
            </a>
        </div>
    </div>
</article>
{% endblock %}
